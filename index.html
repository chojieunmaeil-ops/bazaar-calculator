*{box-sizing:border-box}body{margin:0;font-family:Arial,'Malgun Gothic',sans-serif;background:#f5f7fb;color:#101828}.wrap{max-width:1080px;margin:auto;padding:24px 24px 130px}h1{margin:0 0 8px;font-size:30px}.sub{color:#667085;margin-bottom:22px}.filters{display:flex;gap:8px;flex-wrap:wrap}.filter{border:1px solid #d0d5dd;background:#fff;border-radius:24px;padding:10px 14px;cursor:pointer}.filter.active{background:#17202b;color:#fff}.search{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:12px;font-size:15px;margin:10px 0}.tools{display:flex;gap:18px;align-items:center;margin:5px 0 14px}.count{color:#667085;font-size:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:#fff;border:1px solid #dbe1ea;border-radius:16px;padding:16px;min-height:160px}.cat{font-size:13px;color:#667085}.name{font-size:17px;font-weight:700;margin:8px 0 22px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.price{font-size:19px;font-weight:800}.qty{display:flex;align-items:center;border:1px solid #d0d5dd;border-radius:10px;overflow:hidden}.qty button{border:0;background:#f8fafc;width:42px;height:40px;font-size:22px;cursor:pointer}.qty span{min-width:42px;text-align:center;font-weight:800}.lineamt{font-weight:800}.sold{color:#d92d20;font-weight:900}.card.sold .qty button{cursor:not-allowed;opacity:.35}.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #d0d5dd;box-shadow:0 -4px 18px #0001;z-index:20}.bottomin{max-width:1080px;margin:auto;padding:12px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.reset,.view{padding:11px 15px;border-radius:10px;cursor:pointer;font-weight:700}.reset{background:#fff;border:1px solid #d0d5dd}.view{background:#17202b;color:#fff;border:0}.summary{display:flex;gap:18px;flex:1;justify-content:flex-end;flex-wrap:wrap}.metric{font-size:14px;color:#667085}.metric b{display:block;color:#101828;font-size:19px}.total b{font-size:23px}.modal{display:non </style></head><body><main class="wrap"><h1>바자회 구매 금액 계산</h1><div class="sub">상품의 수량을 선택하시면 총 구매금액이 자동으로 계산됩니다.</div><div id="filters" class="filters"></div><input id="search" class="search" placeholder="상품명 검색"><div class="tools"><label><input id="hideSold" type="checkbox"> 완판 상품 숨기기</label><span id="displayCount" class="count"></span></div><div id="grid" class="grid"></div></main>
<div class="bottom"><div class="bottomin"><button id="reset" class="reset">전체 초기화</button><button id="view" class="view">선택 품목 보기</button><div class="summary"><div class="metric">선택 상품<b id="kindCount">0종</b></div><div class="metric">총 수량<b id="qtyCount">0개</b></div><div class="metric total">총 구매금액<b id="grandTotal">0원</b></div></div></div></div>
<div id="modal" class="modal"><div class="panel"><div class="panelhead"><h2>선택 품목</h2><button id="close" class="close">닫기</button></div><div id="cart"></div><div id="cartTotals" class="carttotals"></div><input id="buyer" class="buyer" placeholder="주문자 이름"><button id="mail" class="mail">메일로 보내기</button></div></div>

const products=[{"category": "매일유업", "name": "피크닉 젤리 청포도 (8입)", "price": 5000}, {"category": "매일유업", "name": "피크닉 젤리 복숭아 (8입)", "price": 5000}, {"category": "매일유업", "name": "피크닉 젤리 사과 (8입)", "price": 5000}, {"category": "매일유업", "name": "자판기 우유맛 분말스틱 (10입)", "price": 3000}, {"category": "매일유업", "name": "요미 튼튼 프룬사과 125ml (24입)", "price": 9000}, {"category": "매일유업", "name": "요미 유기농 사과당근케일 125ml (24입)", "price": 9000}, {"category": "매일유업", "name": "핑크퐁X요미롱롱뻥 사과 (6입)", "price": 9000}, {"category": "매일유업", "name": "상하목장 유기농 우유 125ml (24입)", "price": 13000}, {"category": "매일유업", "name": "소화가잘되는우유 멸균 125ml (24입)", "price": 10000}, {"category": "매일유업", "name": "상하목장 콩물두유 서리태 180ml (15입)", "price": 15000}, {"category": "매일유업", "name": "상하목장 콩물두유 쑥 180ml (15입)", "price": 15000}, {"category": "매일유업", "name": "상하목장 콩물두유 팥 180ml (15입)", "price": 15000}, {"category": "매일유업", "name": "매일두유 99.9 190ml (24입)", "price": 10000}, {"category": "매일유업", "name": "매일두유 검은콩 190ml (24입)", "price": 10000}, {"category": "매일유업", "name": "아몬드브리즈 언스위트 190ml (24입)", "price": 12000}, {"category": "매일유업", "name": "로쉐 T-48", "price": 23000}, {"category": "매일유업", "name": "로쉐 오리진스 T-2 (12입)", "price": 18000}, {"category": "매일유업", "name": "킨더 부에노 (15입)", "price": 13000}, {"category": "매일유업", "name": "킨더 부에노 화이트 (15입)", "price": 13000}, {"category": "매일유업", "name": "셀렉스 보스웰리아 400mg (60정)", "price": 10000}, {"category": "매일유업", "name": "셀렉스 프로틴 당솔브 266g", "price": 10000}, {"category": "매일유업", "name": "셀렉스 프로틴바 너츠 (12입)", "price": 12000}, {"category": "매일유업", "name": "셀렉스 프로틴바 너츠 (18입)", "price": 17000}, {"category": "매일유업", "name": "셀렉스 프로틴바 너츠 (20입)", "price": 18000}, {"category": "매일유업", "name": "셀 프로틴 당솔브 음료 초당옥수수맛 190ml (24입)", "price": 15000}, {"category": "매일유업", "name": "메디웰 구수한누룽지맛 200ml (18입)", "price": 15000}, {"category": "매일유업", "name": "오스트라라이프 360g", "price": 10000}, {"category": "상하농원", "name": "상하농원 블루베리 식혜 1L", "price": 3000}, {"category": "상하농원", "name": "상하농원 동물복지 유정란 15구", "price": 7000} price": 12000}, {"category": "매일유업 (택배)", "name": "바리스타룰스 오르조 블랙_무라벨 350ml (20입)", "price": 12000}];
const soldOutProducts=[]; // 완판 상품명 예: ['상품명']
const state={qty:Array(products.length).fill(0),category:'전체',search:'',hideSold:false};
const won=n=>Number(n).toLocaleString('ko-KR')+'원';
function sold(p){return soldOutProducts.includes(p.name)}
function categories(){return ['전체',...new Set(products.map(p=>p.category))]}
function renderFilters(){const el=document.getElementById('filters');el.innerHTML='';categories().forEach(c=>{const b=document.createElement('button');b.className='filter'+(state.category===c?' active':'');b.textContent=c;b.onclick=()=>{state.category=c;renderFilters();renderProducts()};el.appendChild(b)})}
function visible(){return products.map((p,i)=>({p,i})).filter(x=>(state.category==='전체'||x.p.category===state.category)&&x.p.name.toLowerCase().includes(state.search.toLowerCase())&&(!state.hideSold||!sold(x.p)))}
function renderProducts(){const items=visible(),g=document.getElementById('grid');g.innerHTML='';document.getElementById('displayCount').textContent=`현재 ${items.length}개 상품 표시 / 전체 ${products.length}개`;items.forEach(({p,i})=>{const isSold=sold(p),d=document.createElement('div');d.className='card'+(isSold?' sold':'');d.innerHTML=`<div class="cat">${p.category}</div><div class="name">${p.name} ${isSold?'<span class="sold">완판</span>':''}</div><div class="row"><div><div class="price">${won(p.price)}</div></div><div class="qty"><button data-act="minus" data-i="${i}" ${isSold?'disabled':''}>−</button><span>${state.qty[i]}</span><button data-act="plus" data-i="${i}" ${isSold?'disabled':''}>＋</button></div><div class="lineamt">${won(p.price*state.qty[i])}</div></div>`;g.appendChild(d)});updateSummary()}
function updateSummary(){let kinds=0,q=0,total=0;products.forEach((p,i)=>{if(state.qty[i]>0){kinds++;q+=state.qty[i];total+=state.qty[i]*p.price}});document.getElementById('kindCount').textContent=kinds+'종';document.getElementById('qtyCount').textContent=q+'개';document.getElementById('grandTotal').textContent=won(total)}
document.getElementById('grid').addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(!b)return;const i=+b.dataset.i;if(b.dataset.act==='plus')state.qty[i]++;else state.qty[i]=Math.max(0,state.qty[i]-1);renderProducts()});
document.getElementById('search').addEventListener('input',e=>{state.search=e.target.value;renderProducts()});document.getElementById('hideSold').addEventListener('change',e=>{state.hideSold=e.target.checked;renderProducts()});
document.getElementById('reset').onclick=()=>{state.qty.fill(0);renderProducts()};
function selected(){return products.map((p,i)=>({p,i,q:state.qty[i]})).filter(x=>x.q>0)}
function openCart(){const s=selected(),cart=document.getElementById('cart');cart.innerHTML='';if(!s.length)cart.innerHTML='<p>선택한 품목이 없습니다.</p>';else{s.forEach(({p,q})=>{const r=document.createElement('div');r.className='cartrow';r.innerHTML=`<div><b>${p.name}</b><div class="cat">${p.category}</div></div><div class="num unit">${won(p.price)}</div><div class="num"><b>${q}개</b></div><div class="num"><b>${won(p.price*q)}</b></div>`;cart.appendChild(r)})}let tq=s.reduce((a,x)=>a+x.q,0),tt=s.reduce((a,x)=>a+x.q*x.p.price,0);document.getElementById('cartTotals').innerHTML=`<span>총 수량 ${tq}개</span><span class="grand">총 구매금액 ${won(tt)}</span>`;document.getElementById('modal').style.display='block'}
document.getElementById('view').onclick=openCart;document.getElementById('close').onclick=()=>document.getElementById('modal').style.display='none';document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.style.display='none'};
document.getElementById('mail').onclick=()=>{const s=selected();if(!s.length){alert('선택한 품목이 없습니다.');return}const buyer=document.getElementById('buyer').value.trim()||'미입력';let tq=0,tt=0;const lines=s.map(({p,q})=>{tq+=q;tt+=p.price*q;return `${p.name} / ${won(p.price)} × ${q}개 = ${won(p.price*q)}`});const subject=`바자회 구매 신청 - ${buyer}`;const body=`주문자: ${buyer}\n\n${lines.join('\n')}\n\n총 수량: ${tq}개\n총 구매금액: ${won(tt)}`;location.href=`mailto:heyjj@maeil.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`};
renderFilters();renderProducts();
</script></body></html>
