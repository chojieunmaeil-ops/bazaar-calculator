<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>바자회 구매 금액 계산</title><meta property="og:title" content="바자회 구매 금액 계산"><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#111827;font-family:Arial,"Malgun Gothic",sans-serif}.wrap{max-width:1100px;margin:auto;padding:20px 18px 120px}h1{margin:0 0 7px;font-size:30px}.sub{color:#64748b;margin-bottom:22px}.filters{display:flex;gap:8px;overflow-x:auto;padding:0 0 10px;scrollbar-width:thin}.filter{white-space:nowrap;border:1px solid #cbd5e1;background:#fff;border-radius:22px;padding:10px 14px;cursor:pointer}.filter.active{background:#17202b;color:#fff;border-color:#17202b}.search{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:12px;font-size:16px;margin-bottom:12px}.hide{display:flex;gap:8px;align-items:center;margin:4px 0 12px}.count{font-size:13px;color:#64748b;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid #dde3ec;border-radius:16px;padding:17px;min-height:180px}.cat{font-size:13px;color:#64748b}.name{font-weight:700;font-size:17px;margin:10px 0;min-height:42px}.price{font-size:19px;font-weight:800;margin:12px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.qty{display:flex;align-items:center;border:1px solid #cbd5e1;border-radius:12px;overflow:hidden}.qty button{border:0;background:#f8fafc;font-size:24px;width:42px;height:40px;cursor:pointer}.qty span{width:40px;text-align:center;font-weight:700}.amount{font-weight:800}.sold{color:#dc2626;font-size:18px;font-weight:900}.soldcard{opacity:.68}.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #dbe2ea;box-shadow:0 -4px 16px #0001;z-index:5}.bottomin{max-width:1100px;margin:auto;padding:11px 18px;display:flex;align-items:center;gap:14px}.tot{flex:1}.tot strong{font-size:21px}.view{border:0;border-radius:12px;background:#17202b;color:#fff;padding:13px 17px;font-weight:700;cursor:pointer}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;padding:20px}.modal.on{display:flex}.panel{margin:auto;background:#fff;border-radius:18px;width:min(760px,100%);max-height:90vh;overflow:auto;padding:20px}.mhead{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#eee;border-radius:9px;padding:8px 11px;cursor:pointer}.tbl{width:100%;border-collapse:collapse;margin-top:15px}.tbl th,.tbl td{padding:10px 5px;border-bottom:1px solid #e5e7eb;text-align:right}.tbl th:first-child,.tbl td:first-child{text-align:left}.grand{font-size:23px;font-weight:900;text-align:right;margin:18px 0}.buyer{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}.mail{width:100%;border:0;background:#2563eb;color:white;border-radius:12px;padding:14px;font-size:16px;font-weight:800;margin-top:10px;cursor:pointer}.empty{grid-column:1/-1;padding:40px;text-align:center;color:#64748b;background:#fff;border-radius:16px}

</style></head><body><div class="wrap"><h1>바자회 구매 금액 계산</h1><div class="sub">상품의 수량을 선택하시면 총 구매금액이 자동으로 계산됩니다.</div><div id="filters" class="filters"></div><input id="search" class="search" placeholder="상품명 검색"><label class="hide"><input type="checkbox" id="hideSold"> 완판 상품 숨기기</label><div id="visibleCount" class="count"></div><div id="grid" class="grid"></div></div><div class="bottom"><div class="bottomin"><div class="tot"><div>총 수량 <b id="totalQty">0</b>개</div><strong>총 구매금액 <span id="totalAmt">0원</span></strong></div><button id="viewCart" class="view">선택 품목 보기</button></div></div><div id="modal" class="modal"><div class="panel"><div class="mhead"><h2>선택 품목</h2><button id="closeCart" class="close">닫기</button></div><div id="cart"></div><div class="grand">총 구매금액 <span id="modalTotal">0원</span></div><input id="buyer" class="buyer" placeholder="주문자 이름 입력"><button id="sendMail" class="mail">메일로 보내기</button></div></div><script>
const products=[{"category": "매일유업", "name": "피크닉 젤리 청포도 (8입)", "price": 5000}, {"category": "매일유업", "name": "피크닉 젤리 복숭아 (8입)", "price": 5000}, {"category": "매일유업", "name": "피크닉 젤리 사과 (8입)", "price": 5000}, {"category": "매일유업", "name": "자판기 우유맛 분말스틱 (10입)", "price": 3000}, {"category": "매일유업", "name": "요미 튼튼 프룬사과 125ml (24입)", "price": 9000}, {"category": "매일유업", "name": "요미 유기농 사과당근케일 125ml (24입)", "price": 9000}, {"category": "매일유업", "name": "핑크퐁X요미롱롱뻥 사과 (6입)", "price": 9000}, {"category": "매일유업", "name": "상하목장 유기농 우유 125ml (24입)", "price": 13000}, {"category": "매일유업", "name": "소화가잘되는우유 멸균 125ml (24입)", "price": 10000}, {"category": "매일유업", "name": "상하목장 콩물두유 서리태 180ml (15입)", "price": 15000}, {"category": "매일유업", "name": "상하목장 콩물두유 쑥 180ml (15입)", "price": 15000}, {"category": "매일유업", "name": "상하목장 콩물두유 팥 180ml (15입)", "price": 15000}, {"category": "매일유업", "name": "매일두유 99.9 190ml (24입)", "price": 10000}, {"category": "매일유업", "name": "매일두유 검은콩 190ml (24입)", "price": 10000}, {"category": "매일유업", "name": "아몬드브리즈 언스위트 190ml (24입)", "price": 12000}, {"category": "매일유업", "name": "로쉐 T-48", "price": 23000}, {"category": "매일유업", "name": "로쉐 오리진스 T-2 (12입)", "price": 18000}, {"category": "매일유업", "name": "킨더 부에노 (15입)", "price": 13000}, {"category": "매일유업", "name": "킨더 부에노 화이트 (15입)", "price": 13000}, {"category": "매일유업", "name": "셀렉스 보스웰리아 400mg (60정)", "price": 10000}, {"category": "매일유업", "name": "셀렉스 프로틴 당솔브 266g", "price": 10000}, {"category": "매일유업", "name": "셀렉스 프로틴바 너츠 (12입)", "price": 12000}, {"category": "매일유업", "name": "셀렉스 프로틴바 너츠 (18입)", "price": 17000}, {"category": "매일유업", "name": "셀렉스 프로틴바 너츠 (20입)", "price": 18000}, {"category": "매일유업", "name": "셀 프로틴 당솔브 음료 초당옥수수맛 190ml (24입)", "price": 15000}, {"category": "매일유업", "name": "메디웰 구수한누룽지맛 200ml (18입)", "price": 15000}, {"category": "매일유업", "name": "오스트라라이프 360g", "price": 10000}, {"category": "상하농원", "name": "상하농원 블루베리 식혜 1L", "price": 3000}, {"category": "상하농원", "name": "상하농원 동물복지 유정란 15구", "price": 7000}, {"category": "상하농원", "name": "상하농원 브랏부어스트 미니 120g", "price": 4000}, {"category": "상하농원", "name": "상하농원 프랑크푸르터 미니 120g", "price": 4000}, {"category": "엠즈베이커스", "name": "가루쌀 휘낭시에(얼그레이&초코칩&쿠키앤크림)", "price": 7000}, {"category": "엠즈베이커스", "name": "가루쌀 마들렌(레몬&버터밀크&카라멜)", "price": 7000}, {"category": "제로투세븐", "name": "궁중비책 섬유유연제 베이비&센서티브 1500ml", "price": 4000}, {"category": "제로투세븐", "name": "궁중비책  모이스처 선쿠션 마일드+리필", "price": 9000}, {"category": "제로투세븐", "name": "궁중비책 베이비 세탁비누", "price": 1000}, {"category": "제로투세븐", "name": "궁중비책 프리뮨 레드 수딩 세럼 150ml", "price": 7000}, {"category": "제로투세븐", "name": "궁중비책 키즈 마일드 립밤", "price": 3000}, {"category": "제로투세븐", "name": "궁중비책 키즈 컬러 립밤", "price": 3000}, {"category": "엠즈씨드", "name": "소일베이커 브라운머그", "price": 20000}, {"category": "엠즈씨드", "name": "봄보 머그 더블랙", "price": 7000}, {"category": "엠즈씨드", "name": "봄보 리오 텀블러 더블랙 (40oz)", "price": 27000}, {"category": "엠즈씨드", "name": "봄보 시엘로 텀블러 더블랙 (16oz)", "price": 17000}, {"category": "엠즈씨드", "name": "봄보 몬테 텀블러 더블랙 (18oz)", "price": 22000}, {"category": "엠즈씨드", "name": "드립백 시그니처 블렌드 (7입)", "price": 6000}, {"category": "엠즈씨드", "name": "드립백 과테말라 (7입)", "price": 6000}, {"category": "엠즈씨드", "name": "드립백 에티오피아 (7입)", "price": 6000}, {"category": "엠즈씨드", "name": "드립백 너티멜로우 (7입)", "price": 7000}, {"category": "엠즈씨드", "name": "드립백 디카페인 블렌드 (7입)", "price": 7000}, {"category": "씨케이코퍼레이션즈", "name": "루소 드립백 싱글빈세트 (14입)", "price": 10000}, {"category": "씨케이코퍼레이션즈", "name": "루소 드립백 블렌드세트 (14입)", "price": 10000}, {"category": "씨케이코퍼레이션즈", "name": "루소 드립백 6주세트 (42개입)", "price": 25000}, {"category": "씨케이코퍼레이션즈", "name": "루소 드립백 시그니처 브루잉 (7입)", "price": 5000}, {"category": "라타플랑", "name": "미나리 진정 클렌저 150ml", "price": 4000}, {"category": "라타플랑", "name": "동해 심층보습 오일 투 폼 클렌저 210ml", "price": 8000}, {"category": "라타플랑", "name": "별꽃비타 잡티 세럼 (모모레이 콜라보레이션) 50ml", "price": 7000}, {"category": "매일유업 (택배)", "name": "매일야채 고농축 호박의힘 125ml (24입)", "price": 11000}, {"category": "매일유업 (택배)", "name": "바리스타룰스 무라벨 아메리카노 350ml (20입)", "price": 12000}, {"category": "매일유업 (택배)", "name": "바리스타룰스 오르조 블랙_무라벨 350ml (20입)", "price": 12000}];
const soldOutProducts=[];
const quantities=Array(products.length).fill(0);
let activeCategory='전체';
const el={filters:document.getElementById('filters'),search:document.getElementById('search'),hideSold:document.getElementById('hideSold'),grid:document.getElementById('grid'),visibleCount:document.getElementById('visibleCount'),totalQty:document.getElementById('totalQty'),totalAmt:document.getElementById('totalAmt'),viewCart:document.getElementById('viewCart'),modal:document.getElementById('modal'),closeCart:document.getElementById('closeCart'),cart:document.getElementById('cart'),modalTotal:document.getElementById('modalTotal'),buyer:document.getElementById('buyer'),sendMail:document.getElementById('sendMail')};
const won=n=>Number(n).toLocaleString('ko-KR')+'원';
const categories=['전체',...Array.from(new Set(products.map(p=>p.category)))];
const isSold=p=>soldOutProducts.includes(p.name);
function selected(){return products.map((p,i)=>({...p,qty:quantities[i],amount:p.price*quantities[i]})).filter(x=>x.qty>0&&!isSold(x));}
function updateTotals(){const s=selected();el.totalQty.textContent=s.reduce((a,x)=>a+x.qty,0);el.totalAmt.textContent=won(s.reduce((a,x)=>a+x.amount,0));}
function renderFilters(){el.filters.replaceChildren();categories.forEach(c=>{const b=document.createElement('button');b.type='button';b.className='filter'+(c===activeCategory?' active':'');b.textContent=c;b.addEventListener('click',()=>{activeCategory=c;renderFilters();renderProducts();});el.filters.appendChild(b);});}
function filteredItems(){const q=el.search.value.trim().toLowerCase();return products.map((p,i)=>({p,i})).filter(({p})=>(activeCategory==='전체'||p.category===activeCategory)&&p.name.toLowerCase().includes(q)&&!(el.hideSold.checked&&isSold(p)));}
function renderProducts(){const list=filteredItems();el.visibleCount.textContent=`현재 ${list.length}개 상품 표시 / 전체 ${products.length}개`;el.grid.replaceChildren();if(!list.length){const d=document.createElement('div');d.className='empty';d.textContent='조건에 해당하는 상품이 없습니다.';el.grid.appendChild(d);updateTotals();return;}list.forEach(({p,i})=>{const card=document.createElement('div');card.className='card'+(isSold(p)?' soldcard':'');const cat=document.createElement('div');cat.className='cat';cat.textContent=p.category;const name=document.createElement('div');name.className='name';name.textContent=p.name;const price=document.createElement('div');price.className='price';price.append(document.createTextNode(won(p.price)));if(isSold(p)){const sold=document.createElement('span');sold.className='sold';sold.textContent=' · 완판';price.appendChild(sold);}const row=document.createElement('div');row.className='row';if(isSold(p)){const sold=document.createElement('span');sold.className='sold';sold.textContent='완판';row.appendChild(sold);}else{const qty=document.createElement('div');qty.className='qty';const minus=document.createElement('button');minus.type='button';minus.textContent='−';minus.addEventListener('click',()=>changeQty(i,-1));const num=document.createElement('span');num.textContent=quantities[i];const plus=document.createElement('button');plus.type='button';plus.textContent='＋';plus.addEventListener('click',()=>changeQty(i,1));qty.append(minus,num,plus);row.appendChild(qty);}const amt=document.createElement('div');amt.className='amount';amt.textContent=won(p.price*quantities[i]);row.appendChild(amt);card.append(cat,name,price,row);el.grid.appendChild(card);});updateTotals();}
function changeQty(i,d){if(isSold(products[i]))return;quantities[i]=Math.max(0,quantities[i]+d);renderProducts();}
function openCart(){const s=selected();el.cart.replaceChildren();if(!s.length){el.cart.textContent='선택한 상품이 없습니다.';}else{const table=document.createElement('table');table.className='tbl';table.innerHTML='<thead><tr><th>상품명</th><th>단가</th><th>수량</th><th>금액</th></tr></thead>';const tb=document.createElement('tbody');s.forEach(x=>{const tr=document.createElement('tr');[x.name,won(x.price),x.qty,won(x.amount)].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td);});tb.appendChild(tr);});table.appendChild(tb);el.cart.appendChild(table);}el.modalTotal.textContent=won(s.reduce((a,x)=>a+x.amount,0));el.modal.classList.add('on');}
function sendMail(){const s=selected();if(!s.length){alert('선택한 상품이 없습니다.');return;}const buyer=el.buyer.value.trim();if(!buyer){alert('주문자 이름을 입력해주세요.');el.buyer.focus();return;}const tq=s.reduce((a,x)=>a+x.qty,0),ta=s.reduce((a,x)=>a+x.amount,0);const lines=s.map(x=>`${x.name} / ${won(x.price)} × ${x.qty}개 = ${won(x.amount)}`);const body=`주문자: ${buyer}\n\n${lines.join('\n')}\n\n총 수량: ${tq}개\n총 구매금액: ${won(ta)}`;window.location.href=`mailto:heyjj@maeil.com?subject=${encodeURIComponent('바자회 구매 신청 - '+buyer)}&body=${encodeURIComponent(body)}`;}
el.search.addEventListener('input',renderProducts);el.hideSold.addEventListener('change',renderProducts);el.viewCart.addEventListener('click',openCart);el.closeCart.addEventListener('click',()=>el.modal.classList.remove('on'));el.modal.addEventListener('click',e=>{if(e.target===el.modal)el.modal.classList.remove('on');});el.sendMail.addEventListener('click',sendMail);renderFilters();renderProducts();
</script></body></html>
